name: "Trigger workflow on "

on: 
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/train_model.py'
      - 'src/job.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const mse = 'hello';
          const r2 = 'world';
          const jobName = '1022';

          const prNumber = context.issue.number;

          let body = `Azure ML job ${jobName} completed:`;
          
          body += '\n\n**Evaluation Results**\n';
          body += `* MSE: ${mse}\n`;
          body += `* R2: ${r2}`;
          
          if(!prNumber){
            console.log('no pr found, was this workflow manually triggered?')
          } 
          else{
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
          }