name: "Manually trigger workflow for testing"

on: workflow_dispatch

jobs:
  test-flow:
    runs-on: ubuntu-latest
    steps:
    - name: Check out main branch
      uses: actions/checkout@main
    - name: Install az ml
      run: az extension add -n ml -y
    - name: Login to azure
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}
    - name: Run command job via CLI
      run: az ml job create -f scr/job.yaml --resource-group ${{vars.AZURE_RESOURCE_GROUP}} --workspace-name ${{vars.AZURE_WORKSPACE_NAME}}
