name: "Trigger workflow on "

on: 
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/train_model.py'
      - 'src/job.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
    - name: Check out main branch
      uses: actions/checkout@v7

    - name: Install az ml
      run: az extension add -n ml -y

    - name: Login to azure
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}

    - name: Trigger command job via CLI
      run: |
        JOB_NAME="mlops-run-${{ github.run_id }}"

        az --version
        echo $(az --version)
        az ml job create -f src/job.yaml \
        --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
        --workspace-name ${{vars.AZURE_WORKSPACE_NAME}} \
        --query name -o tsv

        echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

    - name: Query MLW for logs
      run: |
        az ml job stream --name "${{ steps.test-model.outputs.job_name }}"


