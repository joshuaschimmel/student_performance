name: "Trigger workflow on "

on: 
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/train_model.py'
      - 'src/job.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  test-model:
    runs-on: ubuntu-latest
    steps:
    - name: Check out main branch
      uses: actions/checkout@v7

    - name: Install az ml
      run: az extension add -n ml -y

    - name: Login to azure
      uses: azure/login@v2
      with:
        creds: ${{secrets.AZURE_CREDENTIALS}}

    - name: Trigger command job via CLI
      id: trigger
      run: |
        JOB_NAME="mlops-run-${{ github.run_id }}"

        az ml job create -f src/job.yaml \
        --name "$JOB_NAME" \
        --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
        --workspace-name ${{vars.AZURE_WORKSPACE_NAME}} \
        --query name -o tsv

        echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

    - name: Wait for MLW to finish run
      run: |
        

        # in the current CLI, this always exits with 1
        results=$(az ml job stream --name "${{ steps.trigger.outputs.job_name }}" \
        --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
        --workspace-name ${{vars.AZURE_WORKSPACE_NAME}}) || true
        # send exit 0 to continue with pipeline
        exit 0


    - name: download and extract logs
      id: get-logs
      run: |
        az ml job download --name "${{ steps.trigger.outputs.job_name }}" \
          --resource-group ${{vars.AZURE_RESOURCE_GROUP}} \
          --workspace-name ${{vars.AZURE_WORKSPACE_NAME}})

        # downloads all artifacts
        mse=$(cat artifacts/user_logs/std_log.txt | grep MSE)
        r2=$(cat artifacts/user_logs/std_log.txt | grep R2)

        echo "Score $mse"
        echo "Score $r2"
        
        echo "mse=$mse" >> "$GITHUB_OUTPUT"
        echo "r2=$r2" >> "$GITHUB_OUTPUT"

    - name: Comment results to PR
      uses: actions/github-script@v9
      with:
        script: |
          const mse = '${{ steps.get-logs.outputs.mse }}';
          const r2 = '${{ steps.get-logs.outputs.r2 }}';
          const jobName = '${{ steps.trigger.outputs.job_name }}';

          const prNumber = context.issue.number;

          let body = 'Azure ML job ${jobName} completed:';
          
          body += '\n\n**Evaluation Results**\n';
          body += `* MSE: ${mse}\n`;
          body += `* R2: ${r2}`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body,
          });
