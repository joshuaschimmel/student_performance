$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: .
command: >-
  python train_model.py --data ${{inputs.training_data}}
inputs:
  training_data:
    type: uri_file
    path: azureml:students-data@latest
outputs:
  metrics_output:
    type: uri_folder
environment: azureml:AzureML-sklearn-1.0-ubuntu20.04-py38-cpu@latest
compute: azureml:cluster-mlops
experiment_name: student_performance
display_name: student_performance-yml
description: lin-reg on student performance